<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kişisel Bütçe Takipçisi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" integrity="sha512-oHDEc8Xed5Oej2vkk4bDq8e6JHcaT+lW8CL68GZB6U6Y9G9G7mIMK9VnM8DhzXHY0Pxzjz7Y1W8S5w5yXQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://pyscript.net/latest/pyscript.css" />
    <style>
        :root {
            --bg: #f6f8fa;
            --card-bg: #ffffff;
            --accent: #6366f1;
            --accent-dark: #4f46e5;
            --text: #1f2933;
            --muted: #6b7280;
            --danger: #e11d48;
            --success: #16a34a;
        }

        body {
            font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 2rem;
        }

        header {
            max-width: 960px;
            margin: 0 auto 2rem;
            text-align: center;
        }

        h1 {
            margin-bottom: 0.25rem;
            font-size: clamp(1.75rem, 3vw, 2.5rem);
        }

        header p {
            color: var(--muted);
            margin: 0;
        }

        main {
            max-width: 960px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 20px 40px -24px rgba(15, 23, 42, 0.25);
        }

        form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 1rem;
        }

        label {
            display: flex;
            flex-direction: column;
            font-weight: 600;
            color: var(--muted);
            font-size: 0.9rem;
        }

        input,
        select,
        button {
            margin-top: 0.35rem;
            padding: 0.65rem 0.75rem;
            border-radius: 0.65rem;
            border: 1px solid #d1d5db;
            font-size: 1rem;
            font-family: inherit;
        }

        input:focus,
        select:focus,
        button:focus {
            outline: 3px solid rgba(99, 102, 241, 0.25);
            border-color: var(--accent);
        }

        button[type="submit"] {
            background: var(--accent);
            color: white;
            border: none;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button[type="submit"]:hover {
            background: var(--accent-dark);
        }

        .feedback {
            margin-top: 0.75rem;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .feedback.error {
            color: var(--danger);
        }

        .feedback.success {
            color: var(--success);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            color: var(--muted);
        }

        th,
        td {
            padding: 0.75rem 0.5rem;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .amount-income {
            color: var(--success);
            font-weight: 600;
        }

        .amount-expense {
            color: var(--danger);
            font-weight: 600;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 1rem;
        }

        .summary-card {
            background: rgba(99, 102, 241, 0.08);
            border-radius: 0.85rem;
            padding: 1rem;
        }

        .summary-card h3 {
            margin: 0;
            font-size: 0.9rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .summary-card p {
            margin: 0.45rem 0 0;
            font-size: 1.45rem;
            font-weight: 700;
        }

        .delete {
            background: rgba(225, 29, 72, 0.12);
            color: var(--danger);
            border: none;
            cursor: pointer;
            padding: 0.4rem 0.75rem;
            border-radius: 999px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background 0.2s ease;
        }

        .delete:hover {
            background: rgba(225, 29, 72, 0.2);
        }

        @media (max-width: 720px) {
            body {
                padding: 1.25rem;
            }

            form {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Kişisel Bütçe Takipçisi</h1>
        <p>Gelir ve giderlerinizi tek sayfada takip edin, finansal hedeflerinize ulaşın.</p>
    </header>

    <main>
        <section class="card">
            <h2>Yeni İşlem Ekle</h2>
            <form id="transaction-form">
                <label>
                    Açıklama
                    <input type="text" id="description" placeholder="Örn. Maaş, Market alışverişi" required />
                </label>
                <label>
                    Tutar (₺)
                    <input type="number" id="amount" step="0.01" min="0" placeholder="0.00" required />
                </label>
                <label>
                    Tür
                    <select id="transaction-type">
                        <option value="income">Gelir</option>
                        <option value="expense">Gider</option>
                    </select>
                </label>
                <label>
                    Kategori
                    <select id="category">
                        <option value="Maaş">Maaş</option>
                        <option value="Yemek">Yemek</option>
                        <option value="Ulaşım">Ulaşım</option>
                        <option value="Kira">Kira</option>
                        <option value="Eğlence">Eğlence</option>
                        <option value="Diğer">Diğer</option>
                    </select>
                </label>
                <label>
                    Tarih
                    <input type="date" id="date" />
                </label>
                <div style="display:flex; align-items:flex-end;">
                    <button type="submit" style="width:100%;">Kaydet</button>
                </div>
            </form>
            <div id="feedback" class="feedback" aria-live="polite"></div>
        </section>

        <section class="card">
            <h2>Özet</h2>
            <div class="summary">
                <article class="summary-card">
                    <h3>Toplam Gelir</h3>
                    <p id="total-income">₺0.00</p>
                </article>
                <article class="summary-card">
                    <h3>Toplam Gider</h3>
                    <p id="total-expense">₺0.00</p>
                </article>
                <article class="summary-card">
                    <h3>Kalan Bakiye</h3>
                    <p id="balance">₺0.00</p>
                </article>
            </div>
        </section>

        <section class="card">
            <h2>İşlem Geçmişi</h2>
            <table>
                <thead>
                    <tr>
                        <th>Tarih</th>
                        <th>Açıklama</th>
                        <th>Kategori</th>
                        <th>Tutar</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="transactions-body"></tbody>
            </table>
        </section>
    </main>


    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const transactions = [];

            const form = document.getElementById("transaction-form");
            const feedback = document.getElementById("feedback");
            const transactionsBody = document.getElementById("transactions-body");
            const totalIncomeEl = document.getElementById("total-income");
            const totalExpenseEl = document.getElementById("total-expense");
            const balanceEl = document.getElementById("balance");

            const descriptionInput = document.getElementById("description");
            const amountInput = document.getElementById("amount");
            const categorySelect = document.getElementById("category");
            const transactionTypeSelect = document.getElementById("transaction-type");
            const dateInput = document.getElementById("date");

            const formatCurrency = (value) =>
                new Intl.NumberFormat("tr-TR", {
                    style: "currency",
                    currency: "TRY",
                    minimumFractionDigits: 2,
                }).format(value);

            const showFeedback = (message, kind) => {
                feedback.textContent = message;
                feedback.className = `feedback ${kind}`;
            };

            const clearFeedback = () => {
                feedback.textContent = "";
                feedback.className = "feedback";
            };

            const summarizeTransactions = () =>
                transactions.reduce(
                    (summary, transaction) => {
                        if (transaction.amount >= 0) {
                            summary.income += transaction.amount;
                        } else {
                            summary.expense += transaction.amount;
                        }
                        summary.balance += transaction.amount;
                        return summary;
                    },
                    { income: 0, expense: 0, balance: 0 }
                );

            const renderTransactions = () => {
                if (transactions.length === 0) {
                    transactionsBody.innerHTML = `
                        <tr>
                            <td colspan="5" style="text-align:center; color: var(--muted); padding: 2rem 0;">
                                Henüz işlem eklenmedi. İlk kaydınızı yaparak başlayın.
                            </td>
                        </tr>
                    `;
                } else {
                    transactionsBody.innerHTML = transactions
                        .map((transaction, index) => {
                            const amountClass = transaction.amount >= 0 ? "amount-income" : "amount-expense";
                            return `
                                <tr>
                                    <td>${transaction.date}</td>
                                    <td>${transaction.description}</td>
                                    <td>${transaction.category}</td>
                                    <td class="${amountClass}">${formatCurrency(transaction.amount)}</td>
                                    <td><button class="delete" data-index="${index}">Sil</button></td>
                                </tr>
                            `;
                        })
                        .join("");
                }

                const summary = summarizeTransactions();
                totalIncomeEl.textContent = formatCurrency(summary.income);
                totalExpenseEl.textContent = formatCurrency(Math.abs(summary.expense));
                balanceEl.textContent = formatCurrency(summary.balance);
            };

            const addTransaction = (event) => {
                event.preventDefault();

                const description = descriptionInput.value.trim();
                const amountValue = amountInput.value.trim();
                const category = categorySelect.value || "Diğer";
                const transactionType = transactionTypeSelect.value;
                const dateValue = dateInput.value || new Date().toISOString().split("T")[0];

                if (!description) {
                    showFeedback("Lütfen açıklama girin.", "error");
                    return;
                }

                const normalizedAmountValue = amountValue.replace(",", ".");
                const amount = Number(normalizedAmountValue);

                if (!normalizedAmountValue || Number.isNaN(amount)) {
                    showFeedback("Lütfen geçerli bir tutar girin.", "error");
                    return;
                }

                if (amount <= 0) {
                    showFeedback("Tutar 0'dan büyük olmalıdır.", "error");
                    return;
                }

                const signedAmount = transactionType === "income" ? amount : -amount;

                transactions.push({
                    description,
                    amount: signedAmount,
                    category,
                    date: dateValue,
                });

                form.reset();
                showFeedback("İşlem başarıyla eklendi!", "success");
                renderTransactions();
            };

            form.addEventListener("submit", addTransaction);

            transactionsBody.addEventListener("click", (event) => {
                const target = event.target;

                if (target instanceof HTMLElement && target.matches("button.delete")) {
                    const index = Number(target.getAttribute("data-index"));

                    if (Number.isNaN(index)) {
                        showFeedback("İşlem bulunamadı.", "error");
                        return;
                    }

                    transactions.splice(index, 1);
                    renderTransactions();
                    showFeedback("İşlem silindi.", "success");
                }
            });

            renderTransactions();
            clearFeedback();
        });
    </script>

</body>
</html>
